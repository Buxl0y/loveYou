<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08030a">
  <meta name="description" content="A glowing heart made from I love you in 20 languages.">
  <title>Love You ❤️</title>
  <style>
    :root { color-scheme: dark; --pink: #ff597c; --muted: #c9aab7; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh; overflow: hidden; background: #08030a; color: #fff5f8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .backdrop {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 46%, rgba(105, 9, 43, .22), transparent 42%),
        radial-gradient(ellipse at 50% 110%, rgba(55, 8, 39, .18), transparent 48%),
        #08030a;
    }
    .backdrop::before, .backdrop::after {
      content: ""; position: absolute; width: 26rem; height: 26rem; border-radius: 50%;
      filter: blur(95px); opacity: .12; background: #ff174f;
      animation: drift 9s ease-in-out infinite alternate;
    }
    .backdrop::before { left: -18rem; top: 12%; }
    .backdrop::after { right: -18rem; bottom: 4%; background: #a40f69; animation-delay: -4s; }
    main { position: relative; z-index: 1; min-height: 100svh; display: flex; flex-direction: column; align-items: center; }
    .intro { position: absolute; top: clamp(1.1rem, 4vh, 2.8rem); z-index: 2; text-align: center; padding: 0 1rem; }
    .eyebrow { margin: 0 0 .45rem; color: #ff8aa4; font-size: .7rem; letter-spacing: .28em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.65rem, 4.6vw, 2.8rem); font-weight: 650; letter-spacing: -.04em; }
    .subtitle { margin: .5rem 0 0; color: var(--muted); font-size: clamp(.78rem, 2vw, .96rem); }
    canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    .footer { position: absolute; z-index: 2; bottom: max(1.25rem, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: .8rem; padding: 0 1rem; text-align: center; }
    .replay {
      border: 1px solid rgba(255, 119, 154, .4); background: rgba(45, 8, 25, .65); color: #ffeaf0;
      border-radius: 999px; padding: .72rem 1.25rem; font: inherit; font-size: .9rem;
      cursor: pointer; transition: transform .2s ease, background .2s ease, border-color .2s ease;
      backdrop-filter: blur(10px);
    }
    .replay:hover { transform: translateY(-2px); background: rgba(104, 15, 48, .75); border-color: #ff7d9d; }
    .replay:focus-visible { outline: 2px solid #ff9db3; outline-offset: 4px; }
    .signature { color: #927783; font-size: .72rem; letter-spacing: .06em; }
    @keyframes drift { from { transform: translate3d(0,-10px,0) scale(.94); } to { transform: translate3d(15px,18px,0) scale(1.08); } }
    @media (max-height: 560px) {
      .intro { top: .65rem; }
      .eyebrow { display: none; }
      h1 { font-size: 1.45rem; }
      .subtitle { margin-top: .2rem; font-size: .75rem; }
      .footer { bottom: .45rem; gap: .35rem; }
      .replay { padding: .45rem 1rem; }
      .signature { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main>
    <header class="intro">
      <p class="eyebrow">For someone special</p>
      <h1>Made of love <span aria-hidden="true">♡</span></h1>
      <p class="subtitle">One heart, twenty ways to say “I love you”.</p>
    </header>
    <canvas id="heart" role="img" aria-label="A glowing heart formed from love messages in 20 languages."></canvas>
    <footer class="footer">
      <button id="replay" class="replay" type="button">↻ &nbsp; ดูอีกครั้ง</button>
      <div class="signature">A little love, in every language ❤️</div>
    </footer>
  </main>
  <script>
    (() => {
      "use strict";
      const canvas = document.getElementById("heart");
      const ctx = canvas.getContext("2d");
      const replay = document.getElementById("replay");
      const phrases = [
        "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
        "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
        "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
        "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
        "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
      ];
      const colors = ["#ff526e", "#ff6d86", "#ed315d", "#ff8296", "#fa3d68", "#ff9aab"];
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let width = 0, height = 0, scale = 1, spots = [], startedAt = 0, raf = 0;
      const random = (min, max) => min + Math.random() * (max - min);
      const pick = values => values[Math.floor(Math.random() * values.length)];
      const clamp = value => Math.max(0, Math.min(1, value));

      function insideHeart(x, y) {
        const a = x * x + y * y - 1;
        return a * a * a - x * x * y * y * y <= 0;
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        scale = Math.min(width * 0.43 / 1.25, height * 0.32 / 1.15, 280);
        scale = Math.max(42, scale);
        makeHeart();
        startAnimation();
      }

      function makeHeart() {
        spots = [];
        const centerX = width / 2;
        const centerY = height * 0.515;
        const rowGap = Math.max(0.052, 8.5 / scale);
        for (let y = 1.02; y >= -1.03; y -= rowGap) {
          let start = null;
          const step = Math.max(0.006, 2.4 / scale);
          for (let x = -1.25; x <= 1.251; x += step) {
            const inside = insideHeart(x, y);
            if (inside && start === null) start = x;
            if ((!inside || x + step > 1.25) && start !== null) {
              const end = inside && x + step > 1.25 ? x : x - step;
              const left = centerX + start * scale + 2;
              const right = centerX + end * scale - 2;
              const pixelY = centerY - y * scale;
              let cursor = left + random(0, Math.min(8, Math.max(1, (right - left) * 0.08)));
              let guard = 0;
              while (cursor < right - 14 && guard < 80) {
                guard++;
                const text = pick(phrases);
                const size = Math.max(6, Math.min(12, scale * 0.034 + random(0, 2.1)));
                ctx.font = "700 " + size + "px Arial, 'Noto Sans Thai', sans-serif";
                const textWidth = ctx.measureText(text).width;
                if (cursor + textWidth > right) {
                  if (right - cursor < 26) break;
                  cursor += Math.max(4, (right - cursor) * 0.18);
                  continue;
                }
                spots.push({
                  x: cursor + textWidth / 2, y: pixelY, text, size,
                  color: pick(colors), width: textWidth,
                  delay: 0, offsetX: random(-8, 8), lift: random(12, 26),
                  phase: random(0, Math.PI * 2), edge: Math.abs(start) > 0.7 || Math.abs(end) > 0.7
                });
                cursor += textWidth + random(3, 7);
              }
              start = null;
            }
          }
        }
        // Let the outside rows form first, then fill the middle.
        spots.sort((a, b) => Math.abs(b.y - centerY) - Math.abs(a.y - centerY) + random(-2, 2));
        const duration = reduceMotion ? 100 : 7600;
        spots.forEach((spot, index) => { spot.delay = index / Math.max(1, spots.length - 1) * duration; });
      }

      function startAnimation() {
        cancelAnimationFrame(raf);
        startedAt = performance.now();
        raf = requestAnimationFrame(draw);
      }

      function draw(now) {
        ctx.clearRect(0, 0, width, height);
        const elapsed = now - startedAt;
        const duration = reduceMotion ? 100 : 7600;
        for (const p of spots) {
          if (elapsed < p.delay) continue;
          const progress = reduceMotion ? 1 : clamp((elapsed - p.delay) / 850);
          const ease = 1 - Math.pow(1 - progress, 3);
          const x = p.x + p.offsetX * (1 - ease);
          const y = p.y + p.lift * (1 - ease);
          const pulse = reduceMotion ? 0 : Math.max(0, Math.sin(now / 560 + p.phase)) * 0.16;
          ctx.globalAlpha = ease;
          ctx.font = "700 " + p.size + "px Arial, 'Noto Sans Thai', sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "rgba(0,0,0,0.7)";
          ctx.fillText(p.text, x + 1.3, y + 2);
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 4 + pulse * 16;
          ctx.fillStyle = p.color;
          ctx.fillText(p.text, x, y);
          if (pulse > 0.12 && p.edge) {
            ctx.fillStyle = "rgba(255,225,235," + pulse + ")";
            ctx.fillText(p.text, x, y);
          }
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 1;
        }
        if (elapsed < duration + 900 || !reduceMotion) raf = requestAnimationFrame(draw);
      }

      replay.addEventListener("click", () => {
        makeHeart();
        startAnimation();
      });
      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 120);
      }, { passive: true });
      resize();
    })();
  </script>
</body>
</html>
